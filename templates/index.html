<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Book</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <h1>Contact Book</h1>

    <form id="form">
      <input id="name" type="text" placeholder="Name" required>
      <input id="phone" type="tel" placeholder="Phone" required>
      <input id="email" type="email" placeholder="Email (optional)">
      <div class="row">
        <button type="submit" id="saveBtn">Add contact</button>
        <button type="button" id="cancelBtn" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <input id="search" type="search" placeholder="Search by name or phone" aria-label="Search contacts">

    <ul id="list"></ul>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
